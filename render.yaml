# render.yaml
# Configuration file for deploying the Innocence Archive project on Render.
# Uses a top-level 'databases:' key for PostgreSQL definition and 'services:' for web/static sites.

# -------------------------------------
# PostgreSQL Database Definition
# -------------------------------------
databases:
  - name: innocence-archive-db # Unique name for your database
    postgresMajorVersion: 16
    region: ohio # Specifies the region for the database
    plan: free # Specifies the Render plan (e.g., free, starter)
    # postgresMajorVersion is typically set by Render based on the 'plan' or defaults.
    # If you need a specific version like 16, and 'free' doesn't default to it,
    # you might need to create it manually first or check if 'postgresMajorVersion: 16' is allowed here.
    # For 'free' tier, Render usually picks a recent, stable version.
    # Let's assume Render's default for 'free' is acceptable or we adjust if needed post-initial setup.

# -------------------------------------
# Application Services
# -------------------------------------
services:
  # -------------------------------------
  # Backend API Service (Node.js/Express)
  # -------------------------------------
  - type: web # Specifies a web service (for APIs, web servers)
    name: innocence-archive-api # Unique name for your backend API service
    env: node # Specifies the runtime environment
    region: ohio # Deploy in the same region as the database
    rootDir: server # Directory of your backend code
    
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node server.js
    
    healthCheckPath: /

    envVars:
      - key: DATABASE_URL
        fromDatabase: # Injects the connection string
          name: innocence-archive-db # Must match the name of your database defined above
          property: connectionString
      - key: NODE_ENV
        value: production
      # PORT is automatically injected by Render

  # -------------------------------------
  # Frontend Client Service (React/Vite)
  # -------------------------------------
  - type: static_site # Specifies a static site service
    name: innocence-archive-client # Unique name for your frontend client
    env: node # Environment for the build process
    rootDir: newclient # Directory of your frontend code
    
    buildCommand: npm install && npm run build
    publishDirectory: dist
    
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
        
    envVars:
      - key: VITE_API_URL
        value: https://innocence-archive-api.onrender.com
