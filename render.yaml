# render.yaml
# Configuration file for deploying the Innocence Archive project on Render.
# Uses a top-level 'databases:' key for PostgreSQL definition and 'services:' for web/static sites.

# -------------------------------------
# PostgreSQL Database Definition
# -------------------------------------
databases:
  - name: innocence-archive-db # Unique name for your database
    postgresMajorVersion: 16 # Specifies the PostgreSQL major version
    region: ohio # Specifies the region for the database
    plan: free # Specifies the Render plan

# -------------------------------------
# Application Services
# -------------------------------------
services:
  # -------------------------------------
  # Backend API Service (Node.js/Express)
  # -------------------------------------
  - type: web # Specifies a web service (for APIs, web servers)
    name: innocence-archive-api # Unique name for your backend API service
    env: node # Specifies the runtime environment
    region: ohio # Deploy in the same region as the database
    rootDir: server # Directory of your backend code
    
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node server.js # Command to start your Express server
    
    healthCheckPath: / # Optional health check path

    envVars:
      - key: DATABASE_URL
        fromDatabase: # Injects the connection string
          name: innocence-archive-db # Must match the name of your database defined above
          property: connectionString
      - key: NODE_ENV
        value: production
      # PORT is automatically injected by Render

  # -------------------------------------
  # Frontend Client Service (React/Vite) - MODIFIED
  # -------------------------------------
  - type: web # MODIFIED: Changed from static_site to web, as per user-provided example
    name: innocence-archive-client # Unique name for your frontend client
    env: node # Environment for the build process (Vite needs Node)
    runtime: static # ADDED: Specifies that this web service serves static content
    rootDir: newclient # Directory of your frontend code
    
    buildCommand: npm install && npm run build # Standard Vite build command
    staticPublishPath: dist # MODIFIED: Changed from publishDirectory, path to built static files (relative to rootDir)
    
    # Rewrite rules for Single Page Applications (SPAs) like React
    routes:
      - type: rewrite
        source: /* # Matches all paths
        destination: /index.html # Serves index.html for all matched paths
        
    envVars: # Environment variables available during the frontend build process
      - key: VITE_API_URL
        value: https://innocence-archive-api.onrender.com # URL of your deployed backend API
